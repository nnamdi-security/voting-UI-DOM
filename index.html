<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
      <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <!-- Header -->
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-gray-800">🗳️ Voting System</h1>
          <p class="text-gray-600 mt-1">Cast your vote below</p>
        </div>

        <!-- Voter Selection -->
        <div class="mb-4">
          <label for="voterSelect" class="block text-sm font-medium text-gray-700 mb-1">
            Select Voter
          </label>
          <select 
            id="voterSelect" 
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
          >
            <option value="">-- Select a voter --</option>
          </select>
        </div>

        <!-- Candidate Selection -->
        <div class="mb-6">
          <label for="candidateSelect" class="block text-sm font-medium text-gray-700 mb-1">
            Select Candidate
          </label>
          <select 
            id="candidateSelect" 
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
          >
            <option value="">-- Select a candidate --</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col gap-3">
          <button 
            id="castVoteBtn" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-[1.02]"
          >
            🗳️ Cast Vote
          </button>
          <button 
            id="showResultBtn" 
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-[1.02]"
          >
            📊 Show Results
          </button>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div 
      id="resultModal" 
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
        <!-- Modal Header -->
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
          <h2 class="text-2xl font-bold text-gray-800">📊 Election Results</h2>
          <button 
            id="closeModalBtn" 
            class="text-gray-400 hover:text-gray-600 transition-colors text-2xl"
          >
            ✕
          </button>
        </div>

        <!-- Modal Body -->
        <div id="resultContent" class="p-6">
          <!-- Results will be dynamically inserted here -->
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
