<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body>
    <header class="w-full bg-[#10233f] ">
            <nav>
                <div class="text-center text-yellow-700">Hackathon 3.0</div>
                <ul class="flex gap-4 justify-center text-white p-4">
                    <a href="#"><li>Home</li></a>
                    <a href="#"><li>About</li></a>
                    <a href="#"><li>Methodology</li></a>
                    <a href="#"><li>Contact</li></a>
                </ul>
            </nav>
    </header>

    <main>
        <section class="border-gray-500 p-4">
            <div>
                <h2>Cast your Vote</h2>
                <p>Select your name and your chosen candidate, then submit your ballot</p>
            </div>
            <div>
                <label for="voter-name" class="block text-sm font-medium mt-4">Your name</label>
                <select name="voter-name" id="voter-name" class="w-full rounded-md border">
                    <option value="" selected disabled>Select your name</option>
                </select>

                <label for="candidate" class="block text-sm font-medium mt-4">Candidate</label>
                <select name="candidate" id="candidate" class="w-full rounded-md border">
                    <option value="" selected disabled>Select your candidate</option>
                </select>

                  <button
                    class="w-full bg-[#10233f] text-white mt-4"
                    >Vote</button>
            </div>

        </section>

        <section class="p-4">
            <div>
                <button
                class="bottom-2 border-2 p-0.5 rounded-md"
                >Show Result</button>


            </div>
        </section>
    </main>

    <footer>
    </footer>
</body>
</html>
