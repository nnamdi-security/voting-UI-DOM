<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Voting App</title>

    <!-- Tailwind via CDN — simplest way to get Tailwind working with no extra setup.
         (If your class wants you to install Tailwind properly through Vite/PostCSS,
         you can swap this out later — the classes used below will still work.) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-xl shadow p-6">
      <h1 class="text-2xl font-bold text-slate-800 mb-1">Class Voting</h1>
      <p class="text-slate-500 text-sm mb-6">Pick your name, pick your candidate, then cast your vote.</p>

      <!-- Voter dropdown -->
      <label for="voter-select" class="block text-sm font-medium text-slate-700 mb-1">
        Who are you?
      </label>
      <select id="voter-select" class="w-full border border-slate-300 rounded-md p-2 mb-4">
        <!-- filled in by JS -->
      </select>

      <!-- Candidate dropdown -->
      <label for="candidate-select" class="block text-sm font-medium text-slate-700 mb-1">
        Vote for
      </label>
      <select id="candidate-select" class="w-full border border-slate-300 rounded-md p-2 mb-6">
        <!-- filled in by JS -->
      </select>

      <!-- Buttons -->
      <div class="flex gap-3">
        <button
          id="cast-vote-btn"
          class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md py-2 transition"
        >
          Cast Vote
        </button>
        <button
          id="show-result-btn"
          class="flex-1 bg-slate-700 hover:bg-slate-800 text-white font-medium rounded-md py-2 transition"
        >
          Show Result
        </button>
      </div>

      <!-- Message area (used for "vote cast!" or "already voted" messages) -->
      <p id="message" class="mt-4 text-sm font-medium"></p>

      <!-- Result area -->
      <section id="result" class="mt-4 hidden">
        <h2 class="font-semibold text-slate-800 mb-2">Results</h2>
        <ul id="result-list" class="text-sm text-slate-700 space-y-1"></ul>
        <p id="result-winner" class="mt-2 font-semibold text-indigo-700"></p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
